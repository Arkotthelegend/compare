<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#152235">
  <title>BALANCE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23152235' width='32' height='32'/%3E%3Cpath d='M4 20 H28' stroke='%23e7eef5' stroke-width='2'/%3E%3Cpath d='M16 20 L10 28 H22 Z' fill='%2300EDFF'/%3E%3Crect x='7' y='12' width='6' height='6' fill='%23e7eef5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;560;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brandline">
        <p class="brand">Balance</p>
        <button id="menuBtn" type="button" hidden>Menu</button>
      </div>
      <p class="meta" id="levelLabel"></p>
      <p class="meta scoreline"><span id="scoreLabel"></span><span id="timerLabel"></span></p>
    </header>

    <section id="homeScreen">
      <p class="eyebrow">Weight times distance</p>
      <h1>BALANCE</h1>
      <p class="lede">Drag weights onto the seesaw. A heavy block close to the pivot can match a light block farther away.</p>
      <p id="bootError" class="boot-error" hidden>The game could not start. Run npm start, then open http://localhost:4173.</p>
      <div class="modes">
        <button class="mode" type="button" data-mode="classic">
          <strong>Classic</strong>
          <span>Levels that teach the seesaw, then ask for tighter balance.</span>
        </button>
        <button class="mode" type="button" data-mode="endless">
          <strong>Endless</strong>
          <span>A new solvable challenge after every balance.</span>
        </button>
        <button class="mode" type="button" data-mode="time">
          <strong>Time attack</strong>
          <span>Ninety seconds. Clear as many as you can.</span>
        </button>
        <button class="mode" type="button" data-mode="perfect">
          <strong>Perfect</strong>
          <span>The beam only accepts a very small torque difference.</span>
        </button>
        <button class="mode" type="button" data-mode="daily">
          <strong>Daily challenge</strong>
          <span>One shared seesaw for today's date. One saved result.</span>
        </button>
      </div>
    </section>

    <section id="playScreen" hidden>
      <p id="hintLabel"></p>
      <svg id="board" viewBox="0 0 1000 520" role="img" aria-label="Seesaw. Drag weights onto the beam.">
        <g id="scale"></g>
        <g id="ghosts"></g>
        <g id="fulcrum"></g>
        <g id="beam"></g>
        <g id="pieces"></g>
        <text id="dragReadout"></text>
      </svg>
      <div class="controls">
        <button class="primary" id="checkBtn" type="button">Check</button>
        <button class="ghost" id="retryBtn" type="button">Reset</button>
        <button class="ghost" id="soundBtn" type="button">Sound on</button>
      </div>
      <div id="resultPanel" hidden>
        <p id="resultTitle"></p>
        <p id="resultCopy"></p>
        <div id="resultMath"></div>
        <p id="resultMeta"></p>
        <p id="stars"></p>
        <button class="primary" id="nextBtn" type="button" hidden>Next</button>
      </div>
    </section>

    <section id="summaryScreen" hidden>
      <p class="eyebrow">Session</p>
      <h1 id="summaryTitle"></h1>
      <p id="summaryBody"></p>
      <div class="controls">
        <button class="primary" id="summaryHome" type="button">Menu</button>
        <button class="ghost" id="dailyReplay" type="button">Replay daily</button>
      </div>
    </section>
  </div>
  <script type="module">
    import("./js/game.js").catch(() => {
      const banner = document.querySelector("#bootError");
      if (banner) banner.hidden = false;
    });
  </script>
</body>
</html>
